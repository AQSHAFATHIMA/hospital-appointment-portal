apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-portal

spec:
  replicas: 3
  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app: hospital-portal

  template:
    metadata:
      labels:
        app: hospital-portal

    spec:
      containers:
        - name: hospital-portal
          image: 78619/hospital-appointment-portal:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: hospital-portal-service

spec:
  type: NodePort

  selector:
    app: hospital-portal

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30010
